name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android version
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export APP_VERSION="${GITHUB_REF_NAME}"
          else
            export APP_VERSION="$(node -p "require('./package.json').version")"
          fi
          node scripts/configure-android.mjs

      - name: Build preview APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Financeiro-preview-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Restore release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 secret is required for tagged releases" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/financeiro-release.keystore"

      - name: Configure signed release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APP_VERSION: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
          SIGN_RELEASE: 'true'
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/financeiro-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android.mjs

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/financeiro-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Financeiro-${GITHUB_REF_NAME}.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Financeiro $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "Financeiro-${GITHUB_REF_NAME}.apk" --clobber
